<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <!-- Squircle slate background (iOS superellipse), transparent outside -->
  <path d="M256 16
           C 120 16, 16 120, 16 256
           C 16 392, 120 496, 256 496
           C 392 496, 496 392, 496 256
           C 496 120, 392 16, 256 16 Z"
        fill="hsl(222, 47%, 11%)"/>

  <!-- Mark group, scaled to ~95% and centered -->
  <g transform="translate(256,256) scale(3.0) translate(-60,-55)">
    <!-- D-stroke: white so it reads on slate -->
    <path d="M40 25V85H65C72.9565 85 80.5871 81.8393 86.2132 76.2132C91.8393 70.5871 95 62.9565 95 55C95 47.0435 91.8393 39.4129 86.2132 33.7868C80.5871 28.1607 72.9565 25 65 25H40Z"
          stroke="hsl(0, 0%, 100%)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Blue wedge -->
    <path d="M65 55H95C95 62.9565 91.8393 70.5871 86.2132 76.2132C80.5871 81.8393 72.9565 85 65 85V55Z"
          fill="hsl(217, 91%, 60%)"/>
    <!-- Blue dot -->
    <circle cx="25" cy="55" r="5" fill="hsl(217, 91%, 60%)"/>
  </g>
</svg>
