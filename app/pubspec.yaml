name: uzbek_crm
description: CRM for Uzbekistan small businesses
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.2.0

  # HTTP
  dio: ^5.4.3

  # Local storage
  shared_preferences: ^2.3.2

  # Date & number formatting
  intl: 0.20.2

  # Image caching
  cached_network_image: ^3.4.1

  # Image picker for product photos
  image_picker: ^1.1.2

  # Calendar for appointments
  table_calendar: ^3.1.2

  # Firebase
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.3


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
