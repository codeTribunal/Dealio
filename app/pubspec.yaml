name: dealio
description: CRM for Uzbekistan small businesses
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.2.0

  # HTTP
  dio: ^5.4.3

  # Local storage
  shared_preferences: ^2.3.2

  # Date & number formatting
  intl: 0.20.2

  # Image caching
  cached_network_image: ^3.4.1

  # Image picker for product photos
  image_picker: ^1.1.2

  # Calendar for appointments
  table_calendar: ^3.1.2

  # Firebase
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.3

  # Launching external URLs (calendar subscription links)
  url_launcher: ^6.3.0

  # Typography — Manrope (full Cyrillic + Latin), fetched & cached at runtime
  google_fonts: ^6.2.1

  # SVG rendering — the "Micro-Detail" icon set is drawn from inline SVG strings
  flutter_svg: ^2.0.10


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # App launcher icon generator (Android adaptive + legacy mipmaps)
  flutter_launcher_icons: ^0.14.1

  # Native launch/splash screen generator (paper bg + Dealio mark)
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/

# Dealio launcher icon — Android only (launch is Android-only). All rasters are
# generated from the canonical flat geometry in assets/branding/mark.svg:
#  - icon_padded.png     legacy full-bleed paper (#FAFAF8) square, mark at 60% width
#  - icon_foreground.png TRANSPARENT adaptive foreground, mark sized so its
#                        diagonal fits the 66/108 safe-zone circle (no baked
#                        plate — the background layer below supplies the paper,
#                        so the OS mask/parallax work as designed)
#  - icon_monochrome.png white mark, same layout — Android 13+ themed icons
#  - play_store_512.png  Play listing icon (uploaded manually, not consumed here)
# inset:0 because the safe-zone padding is baked into the foreground raster.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/icon_padded.png"
  adaptive_icon_background: "#FAFAF8"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: "assets/branding/icon_monochrome.png"
  remove_alpha_ios: false
  min_sdk_android: 21

# Dealio native splash — Android only. Shows the baked claymorphism image
# (clay tile + mark on #F0F0F8) at cold start; the Dart SplashScreen is now
# wordmark-only, so the mark lives here. Background color MUST match the image
# bg (#F0F0F8 = hsl(240,36%,96%)) so the masked/padded areas blend seamlessly.
# Note: the Android 12+ system splash masks this image to a centered circle.
flutter_native_splash:
  color: "#F0F0F8"
  image: assets/branding/native_neu_splash.png
  android: true
  ios: false
  web: false
  android_12:
    color: "#F0F0F8"
    image: assets/branding/native_neu_splash.png
