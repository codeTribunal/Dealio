<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <title>Dealio icon — full-bleed plated tile</title>
  <!-- Single-image icon: paper plate baked in. Use for the legacy launcher
       icon (image_path), the 512×512 Play Store listing icon (render at 512),
       and any context that takes one flat square.
       NOTE the scale difference vs icon_foreground.svg: the adaptive
       foreground is drawn on the 108dp canvas and the launcher mask crops it
       to the center 72/108, so it carries mask padding (scale 5.1). THIS file
       is displayed full-bleed (nothing crops it), so the mark is scaled up to
       7.65 — ink at 65% of the tile — to look IDENTICAL to the masked
       adaptive tile. Same small-cut geometry (enlarged dot), bbox-centered:
       translate = 512 − (56.25, 55)·7.65. -->
  <rect width="1024" height="1024" fill="#FAFAF8"/>
  <g transform="translate(81.6875 91.25) scale(7.65)">
    <path d="M40 25V85H65C72.9565 85 80.5871 81.8393 86.2132 76.2132C91.8393 70.5871 95 62.9565 95 55C95 47.0435 91.8393 39.4129 86.2132 33.7868C80.5871 28.1607 72.9565 25 65 25H40Z" stroke="#0F1729" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M65 55H90C90 61.6304 87.3661 67.9893 82.6777 72.6777C77.9893 77.3661 71.6304 80 65 80V55Z" fill="#3C83F6"/>
    <circle cx="20" cy="55" r="7.5" fill="#3C83F6"/>
  </g>
</svg>
